<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World of Zuul</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <section class="auth-view view active" id="auth-view">
            <div class="auth-panel">
                <p class="eyebrow">World of Zuul</p>
                <h1>校园冒险</h1>
                <p class="muted">登录或注册后进入游戏，探索房间、拾取物品并解锁隐藏区域。</p>

                <div class="auth-tabs" role="tablist">
                    <button class="tab active" id="login-tab" type="button">登录</button>
                    <button class="tab" id="register-tab" type="button">注册</button>
                </div>

                <form class="auth-form active" id="login-form">
                    <label>
                        用户名
                        <input id="login-username" type="text" autocomplete="username" placeholder="请输入用户名">
                    </label>
                    <label>
                        密码
                        <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入密码">
                    </label>
                    <button class="primary-action" id="login-btn" type="submit">进入游戏</button>
                    <p class="form-message" id="login-message"></p>
                </form>

                <form class="auth-form" id="register-form">
                    <label>
                        用户名
                        <input id="register-username" type="text" autocomplete="username" placeholder="创建用户名">
                    </label>
                    <label>
                        密码
                        <input id="register-password" type="password" autocomplete="new-password" placeholder="创建密码">
                    </label>
                    <button class="primary-action" id="register-btn" type="submit">注册并进入</button>
                    <p class="form-message" id="register-message"></p>
                </form>
            </div>
        </section>

        <section class="menu-view view" id="menu-view">
            <div class="menu-panel">
                <p class="eyebrow">World of Zuul</p>
                <h1>冒险准备</h1>
                <p class="muted" id="menu-welcome">请选择进入游戏的方式。</p>

                <div class="menu-actions">
                    <button class="primary-action menu-action" id="start-game-btn" type="button">开始新游戏</button>
                    <button class="menu-action secondary-action" id="load-game-btn" type="button">读取存档</button>
                    <button class="menu-action secondary-action" id="continue-game-btn" type="button">进入当前进度</button>
                </div>

                <p class="form-message" id="menu-message"></p>
            </div>
        </section>

        <section class="game-view view" id="game-view">
            <img class="scene-bg" id="scene-bg" src="assets/rooms/campus_gate.png" alt="当前房间背景">

            <header class="game-titlebar">
                <div>
                    <p class="eyebrow">当前位置</p>
                    <h2 id="room-name">校园入口</h2>
                </div>
                <button class="hud-button" id="logout-btn" type="button">退出</button>
            </header>

            <div class="player-token" id="player-token" aria-label="玩家角色"></div>

            <aside class="inventory-dock" id="inventory-dock">
                <button class="dock-tab" type="button">背包</button>
                <div class="dock-panel">
                    <h3>背包</h3>
                    <div class="inventory-list" id="inventory-list">暂无物品</div>
                    <div class="weight-line" id="weight-info">负重 0/10kg</div>
                </div>
            </aside>

            <nav class="floating-tools" aria-label="游戏信息">
                <button class="round-tool active" data-panel="room-floating" type="button">房间</button>
                <button class="round-tool" data-panel="command-floating" type="button">命令</button>
                <button class="round-tool" data-panel="log-floating" type="button">日志</button>
            </nav>

            <section class="floating-panel room-floating active" id="room-floating">
                <h3>房间信息</h3>
                <p id="room-description">正在加载房间信息。</p>
                <div class="progress-line" id="room-progress">房间 0/7，物品 0/9</div>
            </section>

            <section class="floating-panel command-floating" id="command-floating">
                <h3>交互命令</h3>
                <div class="quick-actions" id="quick-actions"></div>
                <div class="command-row">
                    <input id="command-input" type="text" placeholder="take key / use key / status">
                    <button class="primary-action small" id="submit-btn" type="button">执行</button>
                </div>
            </section>

            <section class="floating-panel log-floating" id="log-floating">
                <h3>游戏日志</h3>
                <div class="log-panel" id="output-area" aria-live="polite"></div>
            </section>

            <nav class="direction-pad" aria-label="方向控制">
                <button data-command="go north" id="go-north" type="button" title="向北">↑</button>
                <button data-command="go west" id="go-west" type="button" title="向西">←</button>
                <button data-command="look" id="look-room" type="button" title="查看">⊙</button>
                <button data-command="go east" id="go-east" type="button" title="向东">→</button>
                <button data-command="go south" id="go-south" type="button" title="向南">↓</button>
            </nav>
        </section>
    </main>

    <script src="game.js"></script>
</body>
</html>
